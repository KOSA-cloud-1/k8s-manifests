apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-secret
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mariadb-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: prod/mariadb
        property: MYSQL_ROOT_PASSWORD
    - secretKey: DATABASE_USER
      remoteRef:
        key: prod/mariadb
        property: DATABASE_USER
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: prod/mariadb
        property: DATABASE_PASSWORD
    - secretKey: DATABASE_DB_NAME
      remoteRef:
        key: prod/mariadb
        property: DATABASE_DB_NAME
---
apiVersion: external-secrets.io/v1
