apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mariadb-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_USER
      remoteRef:
        key: prod/mariadb
        property: DATABASE_USER
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: prod/mariadb
        property: DATABASE_PASSWORD
    - secretKey: DATABASE_DB_NAME
      remoteRef:
        key: prod/mariadb
        property: DATABASE_DB_NAME
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: prod/mariadb
        property: JWT_SECRET_KEY
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: prod/mariadb
        property: ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceph-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: ceph-secret
    creationPolicy: Owner
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: prod/ceph
        property: S3_ENDPOINT
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: prod/ceph
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: prod/ceph
        property: S3_SECRET_KEY
    - secretKey: S3_BUCKET
      remoteRef:
        key: prod/ceph
        property: S3_BUCKET
