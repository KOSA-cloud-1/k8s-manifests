apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: prod/monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: prod/monitoring/grafana
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-db-secret
    creationPolicy: Owner
  data:
    - secretKey: GF_DATABASE_USER
      remoteRef:
        key: prod/monitoring/grafana-db
        property: user
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: prod/monitoring/grafana-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alertmanager-config-secret
    creationPolicy: Owner
  data:
    - secretKey: alertmanager.yaml
      remoteRef:
        key: prod/monitoring/alertmanager
        property: alertmanager.yaml
