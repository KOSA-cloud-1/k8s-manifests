name: validate-manifests

# PR이 dev/main 으로 올라올 때 매니페스트를 빌드/스키마 검증한다.
# main=운영 자동 sync 이므로, 깨진 매니페스트가 운영에 도달하기 전에 막는 게이트.
# (스키마 검증이라 구조 오류는 잡지만, /health 경로 같은 "값은 유효한데 의미가 틀린" 건 못 잡음)
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      KUSTOMIZE_VERSION: 5.4.3
      KUBECONFORM_VERSION: v0.6.7
      # 기본 k8s 스키마 + CRD 카탈로그(ServiceMonitor/PrometheusRule/ExternalSecret/metallb 등)
      SCHEMA_DEFAULT: default
      SCHEMA_CRD: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize & kubeconform
        run: |
          set -euo pipefail

          KUSTOMIZE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          KUBECONFORM_URL="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          echo "Downloading kustomize from: ${KUSTOMIZE_URL}"
          curl -fSL "${KUSTOMIZE_URL}" -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

          echo "Downloading kubeconform from: ${KUBECONFORM_URL}"
          curl -fSL "${KUBECONFORM_URL}" -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

          kustomize version
          kubeconform -v

      # ① kustomize 디렉터리(infra/monitoring 등): 렌더링 자체가 깨지면 실패 = ArgoCD SyncError 예방
      - name: kustomize build + validate
        run: |
          set -euo pipefail

          while IFS= read -r dir; do
            echo "::group::kustomize build $dir"

            kustomize build "$dir" | kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary \
              -schema-location "$SCHEMA_DEFAULT" \
              -schema-location "$SCHEMA_CRD"

            echo "::endgroup::"
          done < <(find . -name kustomization.yaml -not -path './.git/*' -printf '%h\n' | sort -u)

      # ② 일반 매니페스트: 쿠버네티스 스키마 검증
      #    제외:
      #    - .github workflow
      #    - kustomization.yaml
      #    - helm values
      #    - *.example
      #    - kustomize build로 이미 검증하는 디렉터리
      #    - argocd Application
      - name: kubeconform plain manifests
        run: |
          set -euo pipefail

          mapfile -t files < <(
            git ls-files '*.yaml' '*.yml' \
            | awk '
              /^\.github\// { next }
              /(^|\/)kustomization\.ya?ml$/ { next }
              /(^|\/).*values.*\.ya?ml$/ { next }
              /\.example$/ { next }
              /^infra\/monitoring\// { next }
              /^argocd\// { next }
              { print }
            '
          )

          printf 'validating %d files\n' "${#files[@]}"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No plain Kubernetes manifests found"
            exit 0
          fi

          printf '%s\n' "${files[@]}"

          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            -schema-location "$SCHEMA_DEFAULT" \
            -schema-location "$SCHEMA_CRD" \
            "${files[@]}"
