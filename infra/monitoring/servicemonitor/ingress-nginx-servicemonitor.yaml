# ingress-nginx controller ServiceMonitor
#
# 주의: 이 ServiceMonitor가 동작하려면 ingress-nginx Helm values에 아래 설정이
#       실제 클러스터에 sync되어 controller Service에 "metrics" port가 있어야 한다.
#
#         controller:
#           metrics:
#             enabled: true
#
#       metrics를 켜면 controller Service에 name "metrics"(10254) port가 생성되고
#       nginx_ingress_controller_* metric이 노출된다. (README 참고)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingress-nginx-controller
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: monitoring-observability
spec:
  namespaceSelector:
    matchNames:
      - ingress-nginx
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
