# photo-service ServiceMonitor
#
# 실제 환경에 맞춰 조정한 값:
#   - namespaceSelector.matchNames: apps   (실제 앱 namespace. CLAUDE.md 기본값 "app"이 아님)
#   - selector.matchLabels: app=photo-service   (apps/photo-service/photo-service.yaml Service label)
#   - endpoints[].targetPort: 5003   (Service의 port에 name이 없어 number로 지정)
#
# 주의: 현재 photo-service(app/photo-service/app.py)는 /health, /ready만 노출하고
#       /metrics 와 profile_image_* 커스텀 metric이 없다.
#       이 ServiceMonitor는 앱이 :5003/metrics 를 노출해야 실제로 scrape된다. (README 참고)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: photo-service
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: monitoring-observability
spec:
  namespaceSelector:
    matchNames:
      - apps
  selector:
    matchLabels:
      app: photo-service
  endpoints:
    - targetPort: 5003
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
