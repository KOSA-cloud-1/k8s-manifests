# AI Profile Service alert rules
#
# 이 rule이 참조하는 profile_image_* metric은 apps/photo-service가 /metrics로 직접 노출한다.
# Prometheus는 infra/monitoring/servicemonitor/photo-service-servicemonitor.yaml로 scrape한다.
#
# label "release: kube-prometheus-stack" 는 관례상 부여한다. 현재 클러스터의 Prometheus는
# ruleSelector: {} / ruleSelectorNilUsesHelmValues: false 로 설정되어 있어 label과 무관하게
# 모든 PrometheusRule을 선택한다. (monitoring/kube-prometheus-stack-values.yaml 참고)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-profile-service-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: monitoring-observability
spec:
  groups:
    - name: ai-profile-service.rules
      rules:
        - alert: PhotoServiceHighErrorRate
          # 실패 비율(failed/requests)이 20%를 넘으면 발동.
          expr: |
            sum(rate(profile_image_failed_total[5m]))
            /
            clamp_min(sum(rate(profile_image_requests_total[5m])), 1)
            > 0.2
          for: 2m
          labels:
            severity: warning
            service: photo-service
          annotations:
            summary: "Photo service image conversion error ratio is high"
            description: "Failure ratio (failed/requests) exceeded 20% over the last 5 minutes."

        - alert: PhotoServiceHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum(rate(profile_image_processing_seconds_bucket[5m])) by (le)) > 5
          for: 5m
          labels:
            severity: warning
            service: photo-service
          annotations:
            summary: "Photo service P95 latency is high"
            description: "P95 image processing latency is higher than 5 seconds for 5 minutes."

        - alert: PhotoServiceNoMetrics
          # profile_image_* metric 자체가 사라지면 발동(photo-service /metrics scrape 실패 등).
          # job 라벨 이름에 의존하지 않도록 metric 부재(absent)로 판정한다.
          expr: |
            absent(profile_image_requests_total)
          for: 5m
          labels:
            severity: warning
            service: photo-service
          annotations:
            summary: "Photo service metrics are missing"
            description: "profile_image_* metrics are absent (photo-service /metrics is down or not scraped)."
