# Kubernetes workload alert rules (apps namespace)
#
# namespace="apps" 는 실제 애플리케이션 namespace이다. (namespaces/00-namespaces.yaml,
# apps/*/*.yaml 모두 namespace: apps). CLAUDE.md 예시의 "app"이 아니다.
# kube-state-metrics는 kube-prometheus-stack values에서 enabled: true 로 설치되어 있다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-workload-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: monitoring-observability
spec:
  groups:
    - name: kubernetes-workload.rules
      rules:
        - alert: PodRestartDetected
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="apps"}[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod restart detected in apps namespace"
            description: "A container in the apps namespace restarted during the last 10 minutes."

        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (
              kube_pod_status_ready{namespace="apps", condition="false"}
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod is not ready"
            description: "A pod in the apps namespace has been NotReady for more than 5 minutes."

        - alert: DeploymentReplicaMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="apps"}
            !=
            kube_deployment_status_replicas_available{namespace="apps"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment replica mismatch"
            description: "Available replicas do not match desired replicas in apps namespace."
