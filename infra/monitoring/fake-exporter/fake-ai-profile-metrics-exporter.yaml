# fake-ai-profile-metrics-exporter
#
# ⚠️ 발표/시연(demo)용 SYNTHETIC exporter 이다. 실제 앱 데이터가 아니다.
# photo-service 앱에는 /metrics 가 없고 앱 코드를 수정할 수 없으므로,
# dashboard/alert가 참조하는 profile_image_* metric을 합성으로 노출한다.
# python:3.12-slim 컨테이너가 시작 시 Flask를 설치하고 ConfigMap의 exporter.py 를 실행한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-ai-profile-metrics-exporter-code
  namespace: monitoring
  labels:
    app: fake-ai-profile-metrics-exporter
    app.kubernetes.io/part-of: monitoring-observability
data:
  exporter.py: |
    import os
    import math
    import time
    import random

    from flask import Flask, Response

    # 발표/시연용 SYNTHETIC exporter.
    # 실제 photo-service 앱에는 /metrics 가 없고 앱 코드를 수정할 수 없으므로,
    # dashboard/alert가 참조하는 profile_image_* metric을 합성(synthetic)으로 만들어 노출한다.
    # 값은 경과 시간 기반이라 counter는 단조 증가(rate 계산 가능), gauge는 자연스럽게 진동한다.

    app = Flask(__name__)
    START = time.time()

    # Deployment env로 조정 가능
    REQ_RATE = float(os.getenv("REQUEST_RATE", "3.0"))            # 초당 합성 요청 수
    FAILURE_RATIO = float(os.getenv("FAILURE_RATIO", "0.04"))     # 실패 비율(0~1)
    AVG_LATENCY = float(os.getenv("AVG_LATENCY_SECONDS", "1.5"))  # 평균 처리 시간(초)

    # processing_seconds 히스토그램 누적 분포(p95 ~ 3.3s 가 되도록 튜닝)
    BUCKETS = [
        (0.1, 0.10),
        (0.25, 0.30),
        (0.5, 0.55),
        (1.0, 0.75),
        (2.5, 0.93),
        (5.0, 0.99),
        (10.0, 1.00),
    ]


    def synth_counters():
        elapsed = time.time() - START
        total = REQ_RATE * elapsed
        failed = total * FAILURE_RATIO
        success = total - failed
        return total, success, failed, elapsed


    def render():
        total, success, failed, elapsed = synth_counters()
        queue = max(0, int(8 + 6 * math.sin(elapsed / 30.0) + random.uniform(-2, 2)))
        active = max(0, int(4 + 3 * math.sin(elapsed / 17.0) + random.uniform(-1, 1)))

        lines = []

        def metric(name, mtype, help_text, value):
            lines.append("# HELP %s %s" % (name, help_text))
            lines.append("# TYPE %s %s" % (name, mtype))
            lines.append("%s %s" % (name, value))

        metric("profile_image_requests_total", "counter",
               "Total profile image conversion requests (synthetic).", "%.0f" % total)
        metric("profile_image_success_total", "counter",
               "Total successful profile image conversions (synthetic).", "%.0f" % success)
        metric("profile_image_failed_total", "counter",
               "Total failed profile image conversions (synthetic).", "%.0f" % failed)
        metric("profile_image_queue_depth", "gauge",
               "Pending profile image conversion jobs (synthetic).", str(queue))
        metric("profile_image_active_jobs", "gauge",
               "In-flight profile image conversion jobs (synthetic).", str(active))

        name = "profile_image_processing_seconds"
        lines.append("# HELP %s Profile image processing time in seconds (synthetic)." % name)
        lines.append("# TYPE %s histogram" % name)
        for le, frac in BUCKETS:
            lines.append('%s_bucket{le="%s"} %.0f' % (name, le, total * frac))
        lines.append('%s_bucket{le="+Inf"} %.0f' % (name, total))
        lines.append("%s_sum %.2f" % (name, total * AVG_LATENCY))
        lines.append("%s_count %.0f" % (name, total))

        return "\n".join(lines) + "\n"


    @app.route("/metrics")
    def metrics():
        return Response(render(), mimetype="text/plain; version=0.0.4; charset=utf-8")


    @app.route("/healthz")
    def healthz():
        return Response("ok\n", mimetype="text/plain")


    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-ai-profile-metrics-exporter
  namespace: monitoring
  labels:
    app: fake-ai-profile-metrics-exporter
    app.kubernetes.io/part-of: monitoring-observability
spec:
  # 단일 replica: counter가 target(pod)별로 분리되므로 시연 단순화를 위해 1개로 둔다.
  replicas: 1
  selector:
    matchLabels:
      app: fake-ai-profile-metrics-exporter
  template:
    metadata:
      labels:
        app: fake-ai-profile-metrics-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir flask==3.0.3 && exec python /app/exporter.py
          env:
            - name: REQUEST_RATE
              value: "3.0"
            - name: FAILURE_RATIO
              value: "0.04"
            - name: AVG_LATENCY_SECONDS
              value: "1.5"
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            # 시작 시 pip install 시간을 고려해 넉넉히 대기 (최대 ~150s)
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: fake-ai-profile-metrics-exporter-code
---
apiVersion: v1
kind: Service
metadata:
  name: fake-ai-profile-metrics-exporter
  namespace: monitoring
  labels:
    app: fake-ai-profile-metrics-exporter
    app.kubernetes.io/part-of: monitoring-observability
spec:
  selector:
    app: fake-ai-profile-metrics-exporter
  ports:
    - name: http
      port: 8000
      targetPort: http
