# Kubernetes Network Monitoring dashboard
# Uses node-exporter for node NIC throughput and kubelet/cAdvisor for pod traffic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-network
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring-observability
data:
  network.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": [
        "kubernetes",
        "network",
        "kosa"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "title": "Kubernetes Network Monitoring",
      "uid": "k8s-network-monitoring",
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Node Receive Throughput",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance, device) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*|flannel.*|docker.*|br-.*|vxlan.*|tunl.*\"}[5m])) * 8",
              "legendFormat": "{{instance}} {{device}} rx"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Node Transmit Throughput",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance, device) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*|flannel.*|docker.*|br-.*|vxlan.*|tunl.*\"}[5m])) * 8",
              "legendFormat": "{{instance}} {{device}} tx"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Pod Receive Throughput",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_network_receive_bytes_total{namespace=~\"apps|apps-dev|ingress-nginx\", pod!=\"\"}[5m])) * 8",
              "legendFormat": "{{namespace}}/{{pod}} rx"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pod Transmit Throughput",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_network_transmit_bytes_total{namespace=~\"apps|apps-dev|ingress-nginx\", pod!=\"\"}[5m])) * 8",
              "legendFormat": "{{namespace}}/{{pod}} tx"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Node Packet Drops",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance, device) (rate(node_network_receive_drop_total{device!~\"lo|veth.*|cali.*|flannel.*|docker.*|br-.*|vxlan.*|tunl.*\"}[5m]) + rate(node_network_transmit_drop_total{device!~\"lo|veth.*|cali.*|flannel.*|docker.*|br-.*|vxlan.*|tunl.*\"}[5m]))",
              "legendFormat": "{{instance}} {{device}} drops"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod Packet Drops",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_network_receive_packets_dropped_total{namespace=~\"apps|apps-dev|ingress-nginx\", pod!=\"\"}[5m]) + rate(container_network_transmit_packets_dropped_total{namespace=~\"apps|apps-dev|ingress-nginx\", pod!=\"\"}[5m]))",
              "legendFormat": "{{namespace}}/{{pod}} drops"
            }
          ]
        }
      ]
    }
