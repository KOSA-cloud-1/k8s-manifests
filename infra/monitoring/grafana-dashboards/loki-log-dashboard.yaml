# Loki Log Monitoring dashboard
# Grafana sidecar(label grafana_dashboard: "1")가 자동 로드한다.
# kube-prometheus-stack values: sidecar.dashboards.searchNamespace=ALL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-loki-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring-observability
data:
  loki-logs.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": [
        "loki",
        "logs",
        "kosa"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Loki",
            "multi": false,
            "name": "loki",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "title": "Loki 로그 모니터링",
      "uid": "loki-logs",
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "photo-service 429 로그",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{namespace=\"apps\", app=\"photo-service\"} |= \"429\"",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 2,
          "type": "logs",
          "title": "photo-service 500 로그",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{namespace=\"apps\", app=\"photo-service\"} |= \"500\"",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 3,
          "type": "logs",
          "title": "ingress 전체 로그",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{namespace=\"ingress-nginx\"}",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 4,
          "type": "logs",
          "title": "ingress 4xx/5xx 로그",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{namespace=\"ingress-nginx\"} |~ \" (4|5)[0-9]{2} \"",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 5,
          "type": "logs",
          "title": "argocd 실패 로그",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "{namespace=\"argocd\"} |= \"failed\"",
              "queryType": "range"
            }
          ]
        }
      ]
    }
