# Ingress NGINX Monitoring dashboard
# Grafana sidecar(label grafana_dashboard: "1")가 자동 로드한다.
# kube-prometheus-stack values: sidecar.dashboards.searchNamespace=ALL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ingress-nginx
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring-observability
data:
  ingress-nginx.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": [
        "ingress-nginx",
        "kosa"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "title": "Ingress NGINX 모니터링",
      "uid": "ingress-nginx",
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Ingress 요청률",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (exported_namespace, ingress, exported_service, path) (rate(nginx_ingress_controller_requests{controller_namespace=\"ingress-nginx\"}[5m]))",
              "legendFormat": "{{exported_namespace}}/{{ingress}} {{path}} -> {{exported_service}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP 상태코드별 요청률",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(nginx_ingress_controller_requests{controller_namespace=\"ingress-nginx\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "5xx 오류율",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (exported_namespace, ingress, exported_service, path, status) (rate(nginx_ingress_controller_requests{controller_namespace=\"ingress-nginx\",status=~\"5..\"}[5m]))",
              "legendFormat": "{{exported_namespace}}/{{ingress}} {{path}} -> {{exported_service}} {{status}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "P95 요청 처리시간 (s)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, exported_namespace, ingress, exported_service, path) (rate(nginx_ingress_controller_request_duration_seconds_bucket{controller_namespace=\"ingress-nginx\"}[5m])))",
              "legendFormat": "{{exported_namespace}}/{{ingress}} {{path}} -> {{exported_service}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "4xx 오류율",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (exported_namespace, ingress, exported_service, path, status) (rate(nginx_ingress_controller_requests{controller_namespace=\"ingress-nginx\",status=~\"4..\"}[5m]))",
              "legendFormat": "{{exported_namespace}}/{{ingress}} {{path}} -> {{exported_service}} {{status}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "게이트웨이 엣지 오류 (502/503/504)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (exported_namespace, ingress, exported_service, path, status) (rate(nginx_ingress_controller_requests{controller_namespace=\"ingress-nginx\",status=~\"502|503|504\"}[5m]))",
              "legendFormat": "{{exported_namespace}}/{{ingress}} {{path}} -> {{exported_service}} {{status}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Prometheus scrape 상태",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  },
                  "type": "value"
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(up{namespace=\"ingress-nginx\",endpoint=\"metrics\"})",
              "legendFormat": "ingress-nginx metrics"
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Ingress 누적 요청수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(nginx_ingress_controller_requests{controller_namespace=\"ingress-nginx\"})",
              "legendFormat": "requests"
            }
          ]
        }
      ]
    }
