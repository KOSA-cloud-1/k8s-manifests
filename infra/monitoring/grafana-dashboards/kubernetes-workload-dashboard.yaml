# Kubernetes Workload Monitoring dashboard
# Grafana sidecar(label grafana_dashboard: "1")가 자동 로드한다.
# kube-prometheus-stack values: sidecar.dashboards.searchNamespace=ALL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-workload
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring-observability
data:
  k8s-workload.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": [
        "kubernetes",
        "workload",
        "apps",
        "kosa"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "title": "Kubernetes 워크로드 모니터링",
      "uid": "k8s-workload",
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Deployment 목표 레플리카 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_spec_replicas{namespace=\"apps\"}) by (deployment)",
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Deployment 가용 레플리카 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"apps\"}) by (deployment)",
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Pod별 CPU 사용량",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"apps\", container!=\"POD\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pod별 메모리 사용량",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"apps\", container!=\"POD\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod 재시작",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"apps\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "HPA 현재 vs 목표 레플리카",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_horizontalpodautoscaler_status_current_replicas{namespace=\"apps\"}) by (horizontalpodautoscaler)",
              "legendFormat": "{{horizontalpodautoscaler}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"apps\"}) by (horizontalpodautoscaler)",
              "legendFormat": "{{horizontalpodautoscaler}}"
            }
          ]
        }
      ]
    }
