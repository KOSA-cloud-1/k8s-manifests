# Gateway Monitoring dashboard
# gateway(FastAPI 프록시)가 prometheus-fastapi-instrumentator로 노출하는
# http_request_duration_seconds{handler,method,status} 기반. Grafana sidecar 자동 로드.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gateway
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring-observability
data:
  gateway.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": ["gateway", "kosa"],
      "title": "Gateway Monitoring",
      "uid": "gateway-monitoring",
      "templating": {
        "list": [
          { "name": "datasource", "type": "datasource", "query": "prometheus", "current": {}, "hide": 0 }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Total Request Rate (RPS)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(http_request_duration_seconds_count{service=\"gateway\"}[5m]))" }
          ]
        },
        {
          "id": 2,
          "title": "5xx Error Rate (RPS)",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.1 } ] } }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(http_request_duration_seconds_count{service=\"gateway\", status=~\"5.*\"}[5m]))" }
          ]
        },
        {
          "id": 3,
          "title": "Request Rate by handler",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (handler) (rate(http_request_duration_seconds_count{service=\"gateway\"}[5m]))",
              "legendFormat": "{{handler}}" }
          ]
        },
        {
          "id": 4,
          "title": "P95 Latency by handler",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{service=\"gateway\"}[5m])))",
              "legendFormat": "{{handler}}" }
          ]
        },
        {
          "id": 5,
          "title": "Request Rate by status",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (status) (rate(http_request_duration_seconds_count{service=\"gateway\"}[5m]))",
              "legendFormat": "{{status}}" }
          ]
        },
        {
          "id": 6,
          "title": "Gateway Pod CPU (HPA 기준)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"apps\", pod=~\"gateway.*\", container!=\"\", container!=\"POD\"}[5m]))",
              "legendFormat": "{{pod}}" }
          ]
        }
      ]
    }
