# Kubernetes Cluster Overview dashboard
# Grafana sidecar(label grafana_dashboard: "1")가 자동 로드한다.
# kube-prometheus-stack values: sidecar.dashboards.searchNamespace=ALL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: monitoring-observability
data:
  k8s-cluster-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": [
        "kubernetes",
        "cluster",
        "kosa"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "",
      "title": "Kubernetes 클러스터 개요",
      "uid": "k8s-cluster-overview",
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Ready 노드 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "NotReady 노드 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status!=\"true\"})"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "전체 Pod 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_info)"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Running Pod 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Pending Pod 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_phase{phase=\"Pending\"})"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Failed Pod 수",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_phase{phase=\"Failed\"})"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "클러스터 CPU 사용량 (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"POD\",container!=\"\"}[5m]))"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "클러스터 메모리 사용량",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(container_memory_working_set_bytes{container!=\"POD\",container!=\"\"})"
            }
          ]
        }
      ]
    }
