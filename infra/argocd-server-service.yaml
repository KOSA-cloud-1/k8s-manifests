apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
spec:
  # Bootstrap starts as NodePort because MetalLB may not be ready yet.
  # After MetalLB is healthy, switch this to LoadBalancer and add:
  # metadata.annotations.metallb.io/loadBalancerIPs: 172.17.128.241
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8080
