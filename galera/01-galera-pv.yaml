# ════════════════════════════════════════════════════════════════
# Galera PV 구성 - 3노드 분산 배치
#
# 각 Galera 파드가 서로 다른 Worker 노드에 배치됨:
#   DB_NODES[0] (기본: worker3) → galera-0 전용
#   DB_NODES[1] (기본: worker4) → galera-1 전용
#   DB_NODES[2] (기본: worker5) → galera-2 전용
#
# 플레이스홀더 (deploy.sh가 자동 치환):
#   GALERA_NODE_DB_0 → DB_NODES[0]
#   GALERA_NODE_DB_1 → DB_NODES[1]
#   GALERA_NODE_DB_2 → DB_NODES[2]
# ════════════════════════════════════════════════════════════════

apiVersion: v1
kind: PersistentVolume
metadata:
  name: galera-pv-0
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/galera
    type: DirectoryOrCreate
  claimRef:
    name: data-galera-0
    namespace: default
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - GALERA_NODE_DB_0

