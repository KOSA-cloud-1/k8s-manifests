apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-ingress-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 5003   # /photos 를 ingress 에서 photo-service 로 직접 라우팅 (gateway 경유 제거)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
