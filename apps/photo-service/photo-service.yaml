apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: photo-service
  template:
    metadata:
      labels:
        app: photo-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - worker1
                - worker2
      containers:
      - name: photo-service
        image: fhwang98/photo-service:a0434e2db7f5ee9f272db7699337b749798484ab
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        envFrom:
        - secretRef:
            name: ceph-secret
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: photo-service
spec:
  selector:
    app: photo-service
  ports:
  - port: 5003
    targetPort: 5003
