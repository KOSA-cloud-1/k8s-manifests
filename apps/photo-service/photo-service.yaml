apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: photo-service
  template:
    metadata:
      labels:
        app: photo-service
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - worker1
                - worker2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: photo-service
        image: kosa1team/photo-service:de72bc6c8cc9cb5e7f1218bd89607f621faa93e5
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 6Gi
        startupProbe:
          httpGet:
            path: /health
            port: 5003
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /ready
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        envFrom:
        - secretRef:
            name: ceph-secret
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: photo-service
  namespace: apps
  labels:
    app: photo-service          # ServiceMonitor.selector.matchLabels 대상
spec:
  selector:
    app: photo-service
  ports:
  - name: http                  # ServiceMonitor.endpoints[].port 가 참조
    port: 5003
    targetPort: 5003
