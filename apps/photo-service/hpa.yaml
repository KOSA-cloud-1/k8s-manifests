# photo-service 오토스케일링 — 메모리 사용률 기준.
# 메모리 사용률(파드 requests=5Gi 대비)이 평균 50%(=2.5Gi)를 넘으면 확장.
# 주의 1: idle 시 ~56Mi지만, 실제 AI 이미지 변환은 요청당 ~300MB를 사용한다.
#         즉 50%(=2.5Gi)는 동시 ~8건 처리 수준에서 도달 → 부하 시 scale-out이 의미 있게 동작한다.
# 주의 2: 메모리는 CPU와 달리 부하가 끝나도 잘 안 줄어 scale-down이 늦거나 안 일어날 수 있다.
# 주의 3: photo-service는 메모리 requests=5Gi라 RAM 큰 노드(worker1/worker2)에만 스케줄된다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: photo-service
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: photo-service
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
