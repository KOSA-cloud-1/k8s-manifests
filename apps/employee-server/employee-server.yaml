apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-server
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-server
  template:
    metadata:
      labels:
        app: employee-server
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: employee-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: employee-server
        image: kosa1team/employee-server:5439349e960a81f81e8fb6ba50d3dcf85b7c40c3
        ports:
        - containerPort: 5002
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        env:
        - name: DATABASE_HOST
          value: mysql.data.svc.cluster.local
        - name: PHOTO_SERVICE_URL
          value: "http://photo-service:5003"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DATABASE_PASSWORD
        - name: DATABASE_DB_NAME
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DATABASE_DB_NAME
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: JWT_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: employee-server
  namespace: apps
spec:
  selector:
    app: employee-server
  ports:
  - port: 5002
    targetPort: 5002
