apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-server
  template:
    metadata:
      labels:
        app: employee-server
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: employee-server
      containers:
      - name: employee-server
        image: kosa1team/employee-server:00d440438f3f45b9bafd5ddd38174d2680b4b1cf
        ports:
        - containerPort: 5002
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        env:
        - name: DATABASE_HOST
          value: mysql
        - name: PHOTO_SERVICE_URL
          value: "http://photo-service:5003"
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DATABASE_PASSWORD
        - name: DATABASE_DB_NAME
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: DATABASE_DB_NAME
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: JWT_SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: employee-server
spec:
  selector:
    app: employee-server
  ports:
  - port: 5002
    targetPort: 5002