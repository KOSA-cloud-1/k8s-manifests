apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PROD 환경 overlay → namespace: apps
# base 공통 워크로드 + prod 전용 Ingress(host 없는 catch-all) + HPA/PDB.
# dev overlay 와 대칭: 각 overlay 가 자신의 Ingress 를 소유한다.
namespace: apps
resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
# name = base 의 논리 이미지명. newName(=registry/user) 과 newTag 는 app repo CI 가
# main push 시 DOCKERHUB_USERNAME(newName)·커밋 SHA(newTag)로 갱신한다.
# (dev push 는 overlays/dev/kustomization.yaml 을 갱신)
images:
  - name: auth-server
    newName: kosa1team/auth-server
    newTag: a3189e7d6ff212861d6808529e8904f616852c58
  - name: employee-server
    newName: kosa1team/employee-server
    newTag: a3189e7d6ff212861d6808529e8904f616852c58
  - name: gateway
    newName: kosa1team/gateway
    newTag: a3189e7d6ff212861d6808529e8904f616852c58
  - name: photo-service
    newName: kosa1team/photo-service
    newTag: a3189e7d6ff212861d6808529e8904f616852c58
  - name: frontend
    newName: kosa1team/frontend
    newTag: a3189e7d6ff212861d6808529e8904f616852c58
