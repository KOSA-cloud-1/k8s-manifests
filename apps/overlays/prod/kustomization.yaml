apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD 환경 overlay → namespace: apps
# base 공통 워크로드 + prod 전용 HPA/PDB. Ingress는 infra/ingress.yaml(kosa-infra 앱)이
# 계속 소유하므로 여기서 만들지 않는다(이중 소유/충돌 방지).
namespace: apps

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

# 이미지 태그는 app repo CI가 main push 시 이 블록의 newTag를 갱신한다.
# (dev push 는 overlays/dev/kustomization.yaml 의 newTag 를 갱신)
images:
  - name: kosa1team/auth-server
    newTag: d9877102e954ee6d272923702511b75bfc7a4433
  - name: kosa1team/employee-server
    newTag: d9877102e954ee6d272923702511b75bfc7a4433
  - name: kosa1team/gateway
    newTag: d9877102e954ee6d272923702511b75bfc7a4433
  - name: kosa1team/photo-service
    newTag: d9877102e954ee6d272923702511b75bfc7a4433
  - name: kosa1team/frontend
    newTag: d9877102e954ee6d272923702511b75bfc7a4433
