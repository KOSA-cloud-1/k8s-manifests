apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  maxUnavailable: 1   # HPA로 2~4개 오감: replica 수와 무관하게 "한 번에 1개만 내려감" 보장 (drain 가능)
  selector:
    matchLabels:
      app: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: employee-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: employee-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: photo-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: photo-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nginx
