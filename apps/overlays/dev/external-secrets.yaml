# apps-dev 네임스페이스용 ExternalSecret.
# ExternalSecret 은 namespaced 라, 동기화된 K8s Secret 은 ExternalSecret 이 위치한
# 네임스페이스(apps-dev)에 생성된다. 따라서 prod(apps)의 ExternalSecret 과 별개로
# apps-dev 에도 동일 secret 이 필요하다.
#
# 격리 수준: "공유형" 선택 → dev 도 prod 와 같은 AWS Secrets Manager 키(prod/mariadb, prod/ceph)를
# 재사용한다. 즉 dev/prod 가 같은 DB 자격증명·같은 Ceph 버킷을 공유한다.
# 데이터까지 분리하려면 AWS 에 dev/mariadb, dev/ceph 를 따로 만들고 아래 remoteRef.key 를 바꾼다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-secret
  namespace: apps-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: mariadb-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_USER
      remoteRef:
        key: prod/mariadb
        property: DATABASE_USER
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: prod/mariadb
        property: DATABASE_PASSWORD
    - secretKey: DATABASE_DB_NAME
      remoteRef:
        key: prod/mariadb
        property: DATABASE_DB_NAME
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: prod/mariadb
        property: JWT_SECRET_KEY
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: prod/mariadb
        property: ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ceph-secret
  namespace: apps-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: ceph-secret
    creationPolicy: Owner
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: prod/ceph
        property: S3_ENDPOINT
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: prod/ceph
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: prod/ceph
        property: S3_SECRET_KEY
    - secretKey: S3_BUCKET
      remoteRef:
        key: prod/ceph
        property: S3_BUCKET
