# 최초 부트스트랩용: `kubectl apply -f argocd/argo-app.yaml`.
# 이후에는 argocd/applications/00-kosa-platform.yaml 이 이 앱을 self-manage 하여
# targetRevision=dev 를 self-heal 한다. 두 파일의 spec 은 항상 일치시켜야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kosa-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/KOSA-cloud-1/k8s-manifests'
    targetRevision: dev
    path: argocd/applications
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground  # 리소스 삭제 순서 보장
      - ApplyOutOfSyncOnly=true   # 변경된 리소스만 apply (속도 향상)
