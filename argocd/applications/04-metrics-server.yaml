apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    # HPA가 CPU/메모리 사용률을 읽으려면 metrics-server가 먼저 떠 있어야 한다.
    # apps(wave 10)보다 앞선 wave로 설치한다.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: 'https://kubernetes-sigs.github.io/metrics-server/'
    chart: metrics-server
    targetRevision: 3.12.2
    helm:
      releaseName: metrics-server
      values: |
        args:
          # kubeadm 클러스터의 kubelet은 self-signed 인증서를 쓰므로
          # 이 옵션이 없으면 metrics-server가 kubelet에서 메트릭 수집에 실패한다.
          - --kubelet-insecure-tls
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
