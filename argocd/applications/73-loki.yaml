apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  project: default
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: loki
      targetRevision: 6.29.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/monitoring/loki-values.yaml
          - $values/monitoring/loki-persistence-values.yaml
    - repoURL: 'https://github.com/KOSA-cloud-1/k8s-manifests'
      targetRevision: feature/monitoring-manifest
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
