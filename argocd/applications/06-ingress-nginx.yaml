apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: default
  source:
    repoURL: 'https://kubernetes.github.io/ingress-nginx'
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          metrics:
            # controller Service에 name "metrics"(10254) port를 추가하고
            # nginx_ingress_controller_* metric을 노출한다.
            enabled: true
            # ServiceMonitor는 infra/monitoring/servicemonitor/ingress-nginx-servicemonitor.yaml
            # 에서 직접 관리하므로 chart 내장 serviceMonitor는 켜지 않는다(중복 방지).
            serviceMonitor:
              enabled: false
          service:
            type: LoadBalancer
            annotations:
              metallb.io/loadBalancerIPs: 172.17.128.240
            externalTrafficPolicy: Local
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
