apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # kosa-apps = PROD 환경 (namespace: apps). DEV 환경은 41-apps-dev.yaml(kosa-apps-dev).
  # 앱 이름을 그대로 유지해 기존 운영 워크로드의 소유권 churn/다운타임 없이 path 만
  # raw 디렉터리(apps) → kustomize overlay(apps/overlays/prod) 로 전환한다.
  name: kosa-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: 'https://github.com/KOSA-cloud-1/k8s-manifests'
    targetRevision: dev
    # kustomize overlay 디렉터리. ArgoCD 가 kustomization.yaml 을 감지해 kustomize build 한다.
    path: apps/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: apps
  # HPA가 photo-service / gateway의 replicas를 관리하므로, ArgoCD가 manifest의
  # replicas로 되돌려 HPA와 충돌하지 않도록 해당 필드 차이를 무시한다.
  # (RespectIgnoreDifferences=true 로 sync 시에도 적용을 건너뛴다.)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: photo-service
      jqPathExpressions:
        - .spec.replicas
    - group: apps
      kind: Deployment
      name: gateway
      jqPathExpressions:
        - .spec.replicas
    - group: apps
      kind: Deployment
      name: employee-server
      jqPathExpressions:
        - .spec.replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
