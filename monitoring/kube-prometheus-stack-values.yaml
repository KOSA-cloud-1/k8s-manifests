# Values for prometheus-community/kube-prometheus-stack.
# Install with:
# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   --namespace monitoring --create-namespace \
#   --version 85.2.0 \
#   -f monitoring/kube-prometheus-stack-values.yaml

fullnameOverride: kube-prometheus-stack

crds:
  enabled: true

defaultRules:
  create: true

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: true

  # Grafana DB를 Galera(mysql.data.svc.cluster.local)로 사용한다.
  # SQLite RWO PV 공유로 인한 DB 락(Recreate 전략 필요, 롤아웃 중 다운타임) 문제 해소.
  # 자격증명은 grafana-db-secret(ESO → prod/monitoring/grafana-db)에서 주입.
  # 사전 조건: Galera에 `grafana` DB와 유저 생성 필요 (아래 SQL 참고).
  #   CREATE DATABASE grafana CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
  #   CREATE USER 'grafana'@'%' IDENTIFIED BY '<password>';
  #   GRANT ALL PRIVILEGES ON grafana.* TO 'grafana'@'%';
  env:
    GF_DATABASE_TYPE: mysql
    GF_DATABASE_HOST: mysql.data.svc.cluster.local:3306
    GF_DATABASE_NAME: grafana
  extraEnvFrom:
    - secretRef:
        name: grafana-db-secret

  initChownData:
    enabled: false

  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000
    annotations:
      metallb.io/loadBalancerIPs: 172.17.128.242

  persistence:
    enabled: false

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

alertmanager:
  enabled: true
  service:
    type: ClusterIP
  alertmanagerSpec:
    retention: 120h
    configSecret: alertmanager-config-secret

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    # 보존 30일. retention(시간)·retentionSize(용량) 중 먼저 도달하는 쪽이 삭제 트리거.
    # 현재 적재율(~0.9GB/일)이면 30일 ≈ 27GB로, 80GB(100Gi PV의 ~80% 안전 backstop) 안에 충분히 들어옴.
    retention: 30d
    retentionSize: 80GB
    walCompression: true

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

    probeSelectorNilUsesHelmValues: false
    probeNamespaceSelector: {}
    probeSelector: {}

    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}

    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeConfigNamespaceSelector: {}
    scrapeConfigSelector: {}

prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
